<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Ledger Manager Pro (Port 8083)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .grid-cell { min-height: 72px; font-size: 10px; line-height: 1.1; }
    </style>
</head>
<body class="p-2 sm:p-4 max-w-7xl mx-auto">
    <div id="authGate" class="fixed inset-0 z-[100] bg-slate-950/95 flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl">
        <h2 class="text-xl font-bold text-amber-400 mb-1">📊 Ledger App Login</h2>
        <p class="text-sm text-slate-300 mb-4">အကောင့်ဝင်ပါ သို့မဟုတ် အကောင့်အသစ်ဖွင့်ပါ။</p>
        <label class="block text-xs text-slate-300 mb-1">Email (လက်ရှိ Firebase login အတွက် လိုအပ်သည်)</label>
        <input id="authEmail" type="email" autocomplete="email" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 mb-3 text-white" placeholder="your@email.com">
        <label class="block text-xs text-slate-300 mb-1">Password (အနည်းဆုံး ၆ လုံး)</label>
        <input id="authPassword" type="password" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 mb-3 text-white" placeholder="Password">
        <div class="grid grid-cols-2 gap-2">
          <button id="loginBtn" class="bg-sky-600 hover:bg-sky-500 rounded-lg p-3 font-bold">Login ဝင်မည်</button>
          <button id="registerBtn" class="bg-emerald-700 hover:bg-emerald-600 rounded-lg p-3 font-bold">အကောင့်ဖွင့်မည်</button>
        </div>
        <p id="authMessage" class="text-sm text-amber-300 mt-3" role="status">Firebase နဲ့ ချိတ်ဆက်ရန် စောင့်နေသည်။</p>
        <p class="text-[11px] text-slate-400 mt-3">အကောင့်ဖွင့်ပြီးနောက် Admin အတည်ပြုချက်ဖြင့် တစ်ခါပေးငွေ Lifetime သုံးခွင့်ရနိုင်သည်။</p>
      </div>
    </div>
    <div id="accountBar" class="hidden sticky top-0 z-50 bg-slate-950 border border-slate-700 rounded-lg p-2 mb-3 flex items-center justify-between gap-2 text-xs">
      <span id="signedInLabel" class="text-emerald-300 break-all"></span>
      <button id="logoutBtn" class="bg-rose-700 rounded px-3 py-2 font-bold shrink-0">Logout</button>
    </div>
    <section id="paymentPanel" class="hidden bg-slate-800 border border-amber-500 rounded-xl p-4 mb-4 space-y-3">
      <h2 class="font-bold text-amber-300">🔐 Lifetime သုံးခွင့် / ငွေပေးချေမှု</h2>
      <p id="accessStatus" class="text-sm text-slate-200">သုံးခွင့်အခြေအနေ စစ်ဆေးနေသည်…</p>
      <div id="paymentForm" class="space-y-2">
        <p class="text-sm">တစ်ခါပေးငွေ — <b id="current
